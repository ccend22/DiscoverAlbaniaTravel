name: Deploy to Cloud Run

# Runs on every push to main, or manually from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: bluesquareallapps
  REGION: europe-west1
  SERVICE: travel-discoveralbania-al
  IMAGE: europe-west1-docker.pkg.dev/bluesquareallapps/cloud-run-source-deploy/ccend22-discoveralbaniatravel/travel-discoveralbania-al

# id-token: write lets this job mint a short-lived OIDC token that GCP's
# Workload Identity Federation exchanges for real (temporary) credentials —
# no service-account key stored anywhere.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/673442268676/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@bluesquareallapps.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Pull previous image for layer cache (best-effort)
        run: docker pull "$IMAGE:latest" || true

      - name: Build image
        run: |
          docker build \
            --cache-from "$IMAGE:latest" \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}" \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            -f Dockerfile .

      - name: Push image
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="$IMAGE:${{ github.sha }}" \
            --quiet
